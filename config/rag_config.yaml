# config/rag_config.yaml

retrieval:
  top_k_retrieval: 15
  top_k_reranker: 3
  chunk_size: 1000
  chunk_overlap: 200

models:
  generation_model: gemini-2.5-flash-lite
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  embedding_model: sentence-transformers/all-MiniLM-L6-v2

refusal:
  enable_refusal_check: true
  minimum_required_chunks: 2

evaluation:
  qa_sample_size: 10
  primary_metric: answer_relevancy
  minimum_threshold: 0.75

vector_store:
  persist_directory: chroma_db

project:
  name: CliniRAG
  domain: Medical Clinical Guidelines
  ui_framework: gradio